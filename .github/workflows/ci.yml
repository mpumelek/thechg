name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore local tools
        run: dotnet tool restore
      - name: Restore
        run: dotnet restore TheChg.slnx
      - name: Build
        run: dotnet build TheChg.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test TheChg.slnx --configuration Release --no-build
