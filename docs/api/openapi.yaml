openapi: 3.1.0
info:
  title: Church Platform API — Phase 1 draft
  version: 0.1.0-draft
  description: Staff branch-read and branch account-request capture are implemented. Official membership operations remain draft and are not exposed.
servers:
  - url: /api/v1
security:
  - sessionCookie: []
paths:
  /security/antiforgery:
    get:
      operationId: getAntiforgeryToken
      summary: Obtain a request token for authenticated browser JSON writes
      responses:
        '200':
          description: Request token; also sets an HttpOnly antiforgery cookie
          content:
            application/json:
              schema:
                type: object
                required: [requestToken]
                properties:
                  requestToken:
                    type: string
        '401':
          description: Authentication required
  /registrations/accounts:
    post:
      operationId: captureBranchAccountRegistration
      summary: Record a pending staff or member account request at an authorized South African branch
      description: Requires Member.Create for kind Member or Staff.Register for kind Staff at the stored branch. Browser clients first obtain a request token from /security/antiforgery and send it in X-CSRF-TOKEN. Does not create official membership, set credentials, activate an account or grant permissions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureAccountRegistrationRequest'
      responses:
        '201':
          description: Pending account request captured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingAccountRegistration'
        '400':
          description: Invalid request or missing antiforgery token
        '401':
          description: Authentication required
        '403':
          description: Permission or branch scope denied
        '409':
          description: Account already exists for the email address
  /organization/branches/{branchId}:
    get:
      operationId: getStaffBranch
      summary: Read a South African branch within an active staff grant
      description: Requires Organization.View on the stored branch scope. Unknown and unauthorized IDs both return 403 to avoid an existence probe.
      parameters:
        - name: branchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Authorized branch details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchDetails'
        '401':
          description: Authentication required
        '403':
          description: Permission or scope denied, or branch unavailable
  /me:
    get:
      operationId: getCurrentMember
      summary: Read the authenticated member's permitted profile
      responses:
        '200':
          description: Linked member profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /members:
    post:
      operationId: registerMember
      summary: Create a draft member in an authorized branch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterMemberRequest'
      responses:
        '201':
          description: Draft created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/{memberId}:
    get:
      operationId: getMember
      summary: Read a member within authorized scope
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '200':
          description: Member summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /members/{memberId}/submit:
    post:
      operationId: submitMembershipApplication
      summary: Submit a draft registration for leadership approval
      parameters:
        - $ref: '#/components/parameters/MemberId'
      responses:
        '204':
          description: Submitted
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/{memberId}/approve:
    post:
      operationId: approveMembershipApplication
      summary: Approve a pending application
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '204':
          description: Approved
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /members/{memberId}/reject:
    post:
      operationId: rejectMembershipApplication
      summary: Reject a pending application with reason
      parameters:
        - $ref: '#/components/parameters/MemberId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DecisionRequest'
      responses:
        '204':
          description: Rejected
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: TheChg.Session
      description: First-party staff session; CSRF protection is required for browser writes.
  parameters:
    MemberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    CaptureAccountRegistrationRequest:
      type: object
      additionalProperties: false
      required: [branchId, kind, email]
      properties:
        branchId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [Member, Staff]
        email:
          type: string
          format: email
          maxLength: 256
    PendingAccountRegistration:
      type: object
      additionalProperties: false
      required: [id, accountId, branchId, kind, status]
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        kind:
          type: string
          enum: [Member, Staff]
        status:
          type: string
          enum: [PendingReview]
    BranchDetails:
      type: object
      additionalProperties: false
      required: [id, code, name, circuitId, countryCode]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        circuitId:
          type: string
          format: uuid
        countryCode:
          type: string
          enum: [ZA]
    RegisterMemberRequest:
      type: object
      additionalProperties: false
      required: [branchId, firstName, lastName]
      properties:
        branchId:
          type: string
          format: uuid
        firstName:
          type: string
          minLength: 1
          maxLength: 150
        lastName:
          type: string
          minLength: 1
          maxLength: 150
        phoneNumber:
          type: string
          maxLength: 40
    MemberSummary:
      type: object
      required: [id, branchId, firstName, lastName, status]
      properties:
        id:
          type: string
          format: uuid
        branchId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [Draft, PendingApproval, Approved, PreActive, Active, Rejected, Suspended, Inactive, Archived]
    DecisionRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        traceId:
          type: string
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Permission or scope denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource not found
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Invalid transition or concurrency conflict
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
